<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <title>Today</title>
  <meta name="description" content="A fast capture list. Today or tomorrow. Swipe right to finish, swipe left to move." />

  <link rel="manifest" href="/pwa/manifest.webmanifest" />
  <meta name="theme-color" content="#F9F7F3" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Today" />
  <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
  <link rel="icon" href="/pwa/icon-192.png" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="eyebrow" id="dateLabel">TODAY</div>
      <div class="rule"></div>
      <button class="sync" id="signout" aria-label="Sign out" title="Sign out">
        <span class="dot-sync" id="syncDot"></span>Sign out
      </button>
    </header>

    <div class="board">
      <section class="col" data-day="today">
        <div class="col-head">
          <span class="col-name">Today</span>
          <span class="col-count" id="count-today"></span>
        </div>
        <div class="col-body">
          <ul class="list" id="list-today"></ul>
          <p class="empty" id="empty-today">All clear for today.</p>
        </div>
        <form class="col-add" data-day="today">
          <input type="text" placeholder="Add for today…" enterkeyhint="done" autocapitalize="sentences" aria-label="Add for today" />
          <button type="submit" class="plus" aria-label="Add for today">+</button>
        </form>
      </section>

      <section class="col" data-day="tomorrow">
        <div class="col-head">
          <span class="col-name">Tomorrow</span>
          <span class="col-count" id="count-tomorrow"></span>
        </div>
        <div class="col-body">
          <ul class="list" id="list-tomorrow"></ul>
          <p class="empty" id="empty-tomorrow">Nothing planned.</p>
        </div>
        <form class="col-add" data-day="tomorrow">
          <input type="text" placeholder="Add for tomorrow…" enterkeyhint="done" autocapitalize="sentences" aria-label="Add for tomorrow" />
          <button type="submit" class="plus" aria-label="Add for tomorrow">+</button>
        </form>
      </section>

      <p class="hint">Swipe right to finish · swipe left to move</p>
    </div>

    <form class="addbar" id="addbar">
      <button type="button" class="chip" id="chip" data-day="today">TODAY</button>
      <input id="barInput" type="text" placeholder="Add for today…" enterkeyhint="done" autocapitalize="sentences" aria-label="Add a task" />
      <button type="submit" class="plus" aria-label="Add task">+</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
